name: Finish Build Cycle

on:
  workflow_dispatch:
    inputs:
      stop_timeout:
        description: "Timeout for stopping build jobs and pods (e.g. 300s, 10m)"
        required: false
        default: "300s"
        type: string

jobs:
  finish-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT }}
          persist-credentials: true
          ref: ${{ github.ref_name }}

      - name: Update to latest
        run: |
          set -euxo pipefail
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          git fetch origin "${BRANCH_NAME}"
          git checkout "${BRANCH_NAME}"
          git pull --rebase origin "${BRANCH_NAME}"
          git reset --hard "origin/${BRANCH_NAME}"

      - name: Diagnose checkout state
        run: |
          set -euxo pipefail
          echo "PWD: $(pwd)"
          echo "Branch: $(git branch --show-current)"
          echo "HEAD: $(git rev-parse HEAD)"
          echo "Top-level files:"
          ls -la
          echo "Required files:"
          find . -maxdepth 2 \( -name 'CONTAINER_BASE_IMAGE.bioc' -o -name 'bioc_version' -o -name 'r_version' -o -name 'container_name' \) -print

      - name: Save kubeconfig
        shell: bash
        run: mkdir -p ~/.kube && echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
      
      - name: Install Kubectl
        run: |
          curl -LO 'https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl' && \
          chmod +x ./kubectl && \
          mv ./kubectl /usr/local/bin/kubectl && \
          kubectl version

      - name: Get build identifier
        id: get_build_id
        run: |
          # Extract build ID from branch name
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BUILD_ID=$(echo "${BRANCH_NAME}" | sed 's|build/||' | tr '/' '-')
          BUILD_ID_CLEAN=$(echo "${BUILD_ID}" | tr '[:upper:]' '[:lower:]' | tr '.' '-' | tr -cd '[:alnum:]-')
          NAMESPACE="ns-${BUILD_ID_CLEAN}"
          echo "build_id=${BUILD_ID}" >> $GITHUB_OUTPUT
          echo "namespace=${NAMESPACE}" >> $GITHUB_OUTPUT
          echo "Using Build ID: ${BUILD_ID}"
          echo "Using Namespace: ${NAMESPACE}"

      - name: Stop build jobs
        run: |
          set -euo pipefail
          NAMESPACE="${{ steps.get_build_id.outputs.namespace }}"
          STOP_TIMEOUT="${{ inputs.stop_timeout }}"

          echo "Stopping all build jobs in namespace ${NAMESPACE}..."

          if ! kubectl get namespace "${NAMESPACE}" >/dev/null 2>&1; then
            echo "Namespace ${NAMESPACE} does not exist - nothing to stop"
          else
            # Namespace exists and kubectl is functional; suppress "no resources found" noise
            # by redirecting stderr — real auth/API errors would have failed the namespace check above.

            # Delete all build jobs; --wait=true ensures their pods are terminated before proceeding
            JOB_COUNT=$(kubectl get jobs -n "${NAMESPACE}" -l app=bioc-builder --no-headers 2>/dev/null | wc -l)

            if [[ "${JOB_COUNT}" -gt 0 ]]; then
              echo "Deleting ${JOB_COUNT} build job(s) and waiting for pods to terminate..."
              if ! kubectl delete jobs -n "${NAMESPACE}" -l app=bioc-builder \
                   --wait=true --timeout="${STOP_TIMEOUT}"; then
                echo "Error: timed out waiting for jobs to delete. Remaining jobs:"
                kubectl get jobs -n "${NAMESPACE}" -l app=bioc-builder || true
                echo "Remaining pods:"
                kubectl get pods -n "${NAMESPACE}" -l app=bioc-builder || true
                exit 1
              fi
              echo "All build jobs deleted"
            else
              echo "No active build jobs found"
            fi

            # Delete any remaining bioc-builder pods (e.g., the setup pod from setup_k8s.sh)
            POD_COUNT=$(kubectl get pods -n "${NAMESPACE}" -l app=bioc-builder --no-headers 2>/dev/null | wc -l)

            if [[ "${POD_COUNT}" -gt 0 ]]; then
              echo "Deleting ${POD_COUNT} remaining build pod(s)..."
              if ! kubectl delete pods -n "${NAMESPACE}" -l app=bioc-builder \
                   --wait=true --timeout="${STOP_TIMEOUT}"; then
                echo "Error: timed out waiting for pods to delete. Remaining pods:"
                kubectl get pods -n "${NAMESPACE}" -l app=bioc-builder || true
                exit 1
              fi
              echo "All build pods deleted"
            fi
          fi

          echo "Build jobs stopped successfully"

      - name: Finish Build Cycle
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          set -euxo pipefail
          BUILD_ID="${{ steps.get_build_id.outputs.build_id }}"
          
          # Verify required files exist
          if [[ ! -f "CONTAINER_BASE_IMAGE.bioc" ]]; then
            echo "Error: CONTAINER_BASE_IMAGE.bioc not found"
            echo "Current branch: $(git branch --show-current)"
            echo "HEAD: $(git rev-parse HEAD)"
            echo "Files in repo root:"
            ls -la
            exit 1
          fi
          
          # Get container image
          CONTAINER=$(cat "CONTAINER_BASE_IMAGE.bioc")
          echo "Using container image: ${CONTAINER}"
          
          # Get Bioc version
          BIOC_VERSION=$(cat "bioc_version")
          echo "Using Bioc version: ${BIOC_VERSION}"
          
          # Get container name
          CONTAINER_NAME="bioconductor_docker"
          if [[ -f "container_name" ]]; then
            CONTAINER_NAME=$(cat "container_name")
          fi
          echo "Using container name: ${CONTAINER_NAME}"
          
          # Construct packages URL
          OLD_PACKAGES_URL="https://storage.googleapis.com/bioconductor-packages/${BIOC_VERSION}/container-binaries/${CONTAINER_NAME}/src/contrib/PACKAGES"
          echo "Using packages URL: ${OLD_PACKAGES_URL}"
          
          # Calculate namespace with full timestamp
          NAMESPACE="${{ steps.get_build_id.outputs.namespace }}"
          
          # Execute finish cycle script
          bash ./.github/scripts/finish_cycle.sh "${BUILD_ID}" "${OLD_PACKAGES_URL}" "${CONTAINER}"
          
          # Record completion status
          echo "Build cycle finished successfully"

      - name: Commit and Push Results
        run: |
          set -euxo pipefail
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          git fetch origin "${BRANCH_NAME}"
          git rebase "origin/${BRANCH_NAME}"
          git add . || true
          
          if ! git diff --staged --quiet; then
            git commit -m "Finish build cycle: ${{ steps.get_build_id.outputs.build_id }}"
            git push origin "HEAD:${BRANCH_NAME}"
          else
            echo "No changes to commit"
          fi
