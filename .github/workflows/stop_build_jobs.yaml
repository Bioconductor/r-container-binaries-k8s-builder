name: Stop Build Jobs

on:
  workflow_dispatch:
    inputs:
      stop_timeout:
        description: "Timeout for stopping build jobs and pods (e.g. 300s, 10m)"
        required: false
        default: "300s"
        type: string

jobs:
  stop-build-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Save kubeconfig
        shell: bash
        run: mkdir -p ~/.kube && echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Install Kubectl
        run: |
          curl -LO 'https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl' && \
          chmod +x ./kubectl && \
          mv ./kubectl /usr/local/bin/kubectl && \
          kubectl version

      - name: Get build identifier
        id: get_build_id
        run: |
          # Extract build ID from branch name
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BUILD_ID=$(echo "${BRANCH_NAME}" | sed 's|build/||' | tr '/' '-')
          BUILD_ID_CLEAN=$(echo "${BUILD_ID}" | tr '[:upper:]' '[:lower:]' | tr '.' '-' | tr -cd '[:alnum:]-')
          NAMESPACE="ns-${BUILD_ID_CLEAN}"
          echo "build_id=${BUILD_ID}" >> $GITHUB_OUTPUT
          echo "namespace=${NAMESPACE}" >> $GITHUB_OUTPUT
          echo "Using Build ID: ${BUILD_ID}"
          echo "Using Namespace: ${NAMESPACE}"

      - name: Stop build jobs
        run: |
          set -euo pipefail
          NAMESPACE="${{ steps.get_build_id.outputs.namespace }}"
          STOP_TIMEOUT="${{ inputs.stop_timeout }}"

          echo "Stopping all build jobs in namespace ${NAMESPACE}..."

          if ! kubectl get namespace "${NAMESPACE}" >/dev/null 2>&1; then
            echo "Namespace ${NAMESPACE} does not exist - nothing to stop"
          else
            # Namespace exists and kubectl is functional; suppress "no resources found" noise
            # by redirecting stderr — real auth/API errors would have failed the namespace check above.

            # Delete all build jobs; --wait=true ensures their pods are terminated before proceeding
            JOB_COUNT=$(kubectl get jobs -n "${NAMESPACE}" -l app=bioc-builder --no-headers 2>/dev/null | wc -l)

            if [[ "${JOB_COUNT}" -gt 0 ]]; then
              echo "Deleting ${JOB_COUNT} build job(s) and waiting for pods to terminate..."
              if ! kubectl delete jobs -n "${NAMESPACE}" -l app=bioc-builder \
                   --wait=true --timeout="${STOP_TIMEOUT}"; then
                echo "Error: timed out waiting for jobs to delete. Remaining jobs:"
                kubectl get jobs -n "${NAMESPACE}" -l app=bioc-builder || true
                echo "Remaining pods:"
                kubectl get pods -n "${NAMESPACE}" -l app=bioc-builder || true
                exit 1
              fi
              echo "All build jobs deleted"
            else
              echo "No active build jobs found"
            fi

            # Delete any remaining bioc-builder pods (e.g., the setup pod from setup_k8s.sh)
            POD_COUNT=$(kubectl get pods -n "${NAMESPACE}" -l app=bioc-builder --no-headers 2>/dev/null | wc -l)

            if [[ "${POD_COUNT}" -gt 0 ]]; then
              echo "Deleting ${POD_COUNT} remaining build pod(s)..."
              if ! kubectl delete pods -n "${NAMESPACE}" -l app=bioc-builder \
                   --wait=true --timeout="${STOP_TIMEOUT}"; then
                echo "Error: timed out waiting for pods to delete. Remaining pods:"
                kubectl get pods -n "${NAMESPACE}" -l app=bioc-builder || true
                exit 1
              fi
              echo "All build pods deleted"
            fi
          fi

          echo "Build jobs stopped successfully"
